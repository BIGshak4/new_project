name: Verify code execution compilers

on:
  push:
    branches: [master]
    paths:
      - 'apps/executor/**'
      - 'backend/seeds/execution_cases.json'
      - 'backend/tests/fixtures/execution_smoke.json'
      - '.github/workflows/verify-code-execution.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-execution-compiler-verification
  cancel-in-progress: false

jobs:
  compilers:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install real toolchains and an unprivileged fixture user
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc g++ iverilog ghdl python3
          sudo useradd --uid 1100 --create-home --shell /usr/sbin/nologin jobrun-code
          if sudo -n -u jobrun-code sudo -n true; then
            echo 'The fixture execution user unexpectedly has sudo.' >&2
            exit 1
          fi
          sudo mkdir -p /vercel/sandbox
          sudo chown "$(id -u):$(id -g)" /vercel/sandbox
          sudo chmod 755 /vercel/sandbox
          sudo ln -sf "$(command -v node)" /usr/local/bin/node
          python3 - <<'PY'
          import subprocess
          for cmd in (["python3", "--version"], ["node", "--version"], ["gcc", "--version"], ["g++", "--version"], ["iverilog", "-V"], ["ghdl", "--version"]):
              result = subprocess.run(["env", "PATH=/usr/local/bin:/usr/bin:/bin", *cmd], capture_output=True, text=True, check=True)
              print((result.stdout or result.stderr).splitlines()[0])
          PY
      - name: Install pinned executor dependencies
        working-directory: apps/executor
        run: npm ci
      - name: Auth, adapter, judge and boundary unit tests
        working-directory: apps/executor
        run: npm test && npm run check && npm audit --omit=dev
      - name: Compile and execute committed fixtures in every language
        working-directory: apps/executor
        env:
          JOBRUN_TRUSTED_FIXTURE_CHECK: '1'
        run: npm run check:fixtures
