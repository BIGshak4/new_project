# Render blueprint for the JobRun practice API (backend/). Render -> New -> Blueprint -> this repo.
#
# Server secrets are entered in the Render dashboard, never here.
# Everything marked sync: false is asked for at deploy time.
services:
  - type: web
    name: jobrun-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt                  # closest to Supabase eu-central / Israel; change if the project lives elsewhere
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENV
        value: production              # refuses to start on a dangerous setting (scripted model, open pilot gate, * origins; app/config.py production_problems); Render keeps the previous deploy if the new one refuses (2026-11-08)
      - key: LLM_PROVIDER
        sync: false                    # openai (fallback: anthropic); scripted/manual never in production
      - key: SUPABASE_URL
        value: https://djpwvqpsqbkvprlncjjg.supabase.co
      - key: REQUIRE_PILOT_MEMBERSHIP
        value: "true"
      - key: ALLOWED_ORIGINS
        sync: false                    # the Netlify site URLs, comma-separated, plus http://localhost:3000 for development
      - key: DATABASE_URL
        sync: false                    # Supabase -> Project Settings -> Database -> Session pooler URI
      - key: ANTHROPIC_API_KEY
        sync: false                    # fallback provider only: needed when LLM_PROVIDER=anthropic
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false                    # backend-only read access to private answer photos; never a browser variable
      - key: ANTHROPIC_MODEL
        value: claude-opus-5           # fallback provider's judge model
      - key: OPENAI_API_KEY
        sync: false                    # required for the real provider (LLM_PROVIDER=openai, 2026-10-29)
      - key: OPENAI_MODEL
        value: gpt-6.1-terra           # the judge (Shaked, 2026-11-08: same bands as sol at less than half the price); OPENAI_ROLE_MODELS (default in app/config.py) picks the other roles, the report stays on sol
      # Speed knobs (2026-11-01), set in the dashboard when Shaked picks a row of scripts/judge_speed_matrix.py:
      #   OPENAI_ROLE_EFFORT=evaluator=minimal   (reasoning depth per role; changes how answers are judged)
      #   OPENAI_ROLE_SERVICE_TIER=feedback=default (per role; the code puts feedback, tip and generator on flex, half price, 2026-11-07)
      #   OPENAI_SERVICE_TIER=priority           (faster processing at a higher price; flex = slower, cheaper)
      - key: ALLOW_IN_REVIEW_CONTENT
        value: "true"                  # the pilot serves in_review questions until the first ones are published
      # JUDGE_WARM defaults to true (the judge's prompt cache is warmed when a question opens, 2026-11-02); set false here to stop it
      - key: ASSESS_UNREVIEWED_QUESTIONS
        value: "true"                  # generated questions act like normal ones; the review stamp is their status (Shaked, 2026-11-02)
      - key: DAILY_ATTEMPT_LIMIT
        value: "30"
      - key: DEFAULT_LANGUAGE
        value: en
