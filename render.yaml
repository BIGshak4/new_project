# Render blueprint for the JobRun practice API (backend/). Render -> New -> Blueprint -> this repo.
#
# Server secrets are entered in the Render dashboard, never here.
# Everything marked sync: false is asked for at deploy time.
services:
  - type: web
    name: jobrun-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt                  # closest to Supabase eu-central / Israel; change if the project lives elsewhere
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENV
        value: staging                 # production refuses to start with a scripted model; switch when the key is in
      - key: LLM_PROVIDER
        sync: false                    # openai (fallback: anthropic); scripted/manual never in production
      - key: SUPABASE_URL
        value: https://djpwvqpsqbkvprlncjjg.supabase.co
      - key: REQUIRE_PILOT_MEMBERSHIP
        value: "true"
      - key: ALLOWED_ORIGINS
        sync: false                    # the Netlify site URLs, comma-separated, plus http://localhost:3000 for development
      - key: DATABASE_URL
        sync: false                    # Supabase -> Project Settings -> Database -> Session pooler URI
      - key: ANTHROPIC_API_KEY
        sync: false                    # fallback provider only: needed when LLM_PROVIDER=anthropic
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false                    # backend-only read access to private answer photos; never a browser variable
      - key: ANTHROPIC_MODEL
        value: claude-opus-5           # fallback provider's judge model
      - key: OPENAI_API_KEY
        sync: false                    # required for the real provider (LLM_PROVIDER=openai, 2026-10-29)
      - key: OPENAI_MODEL
        value: gpt-6.1-sol             # the judge; OPENAI_ROLE_MODELS (default in app/config.py) picks the prose models
      - key: ALLOW_IN_REVIEW_CONTENT
        value: "true"                  # the pilot serves in_review questions until the first ones are published
      - key: DAILY_ATTEMPT_LIMIT
        value: "30"
      - key: DEFAULT_LANGUAGE
        value: en
